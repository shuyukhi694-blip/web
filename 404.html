<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 – Usanmaz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--ink:#fff;--mute:#8c8c8c;--line:#1f1f1f;--card:#0a0a0a;
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) linear-gradient(#ffffff08 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/64px 64px;background-color:var(--bg);color:var(--ink);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;font-weight:300;line-height:1.6}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.top{display:flex;justify-content:space-between;padding-top:70px}
.top button{all:unset;cursor:pointer;color:var(--mute)}
.top button[aria-pressed=true]{color:#fff}
.top button:focus-visible{outline:1px solid #fff}
.hero{text-align:center;padding:0 0 90px;border-bottom:1px solid var(--line)}
.logo{width:240px;max-width:60%;height:auto;mix-blend-mode:screen;display:block;margin:-12px auto 28px;animation:sneak 2.8s cubic-bezier(.2,.7,.2,1) both}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:#cfcfcf}
.eyebrow::before{content:"";width:6px;height:6px;background:#fff}
h1{font-weight:400;font-size:clamp(42px,9vw,96px);line-height:1.06;letter-spacing:-.035em;margin:34px 0 28px}
h1 span{display:block;color:var(--mute)}
.sub{max-width:31em;margin:0 auto;color:#bdbdbd;font-size:16px}
.hero .eyebrow,.hero h1,.hero .sub{animation:rise 1.3s 1.5s ease both}.hero h1{animation-delay:1.8s}.hero .sub{animation-delay:2.1s}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:56px 0 24px;gap:16px}
h2{font-weight:400;font-size:22px;letter-spacing:-.01em;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.card{display:flex;flex-direction:column;justify-content:space-between;min-height:188px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:6px;position:relative;transition:border-color .25s,transform .25s}
.card:hover{border-color:#555;transform:translateY(-3px)}
.row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}
.ico{width:40px;height:40px;display:grid;place-items:center;border:1px solid;border-radius:3px}
.ico svg{width:20px;height:20px;fill:currentColor}
.card h3{font-weight:400;font-size:18px;margin:0 0 6px}
.card p{margin:0;font-size:12px;color:var(--mute);line-height:1.5;word-break:break-word;padding-right:30px}
.arrow{position:absolute;right:22px;bottom:24px;width:14px;height:14px;stroke:#bbb;fill:none;stroke-width:1.5;transition:transform .25s}
.card:hover .arrow{transform:translate(2px,-2px)}
.em{color:#ea4335;background:#2a100e;border-color:#4a1d19}.wa{color:#25d366;background:#0d2616;border-color:#1b4a2c}
.ig{color:#e1306c;background:#2a0e18;border-color:#4a1a2b}.fb{color:#1877f2;background:#0d1a30;border-color:#1c3a6b}
.more{text-align:right;margin:22px 0 0}.more a{color:#7aa8ff}
.info{border-top:1px solid var(--line);margin-top:70px;padding:64px 0 70px;display:grid;grid-template-columns:1fr 1.6fr;gap:48px}
.info h2{font-size:clamp(26px,3.4vw,36px);margin:14px 0 0}
.info p{margin:0 0 1em;color:#c9c9c9}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;margin-top:26px;border-top:1px solid var(--line)}
.tl div{padding:18px 0;border-bottom:1px solid var(--line)}
.tl b{display:block;font-weight:400;font-size:17px;margin-bottom:4px}.tl span{color:var(--mute);font-size:14px}
footer{border-top:1px solid var(--line);padding:22px 0;text-align:center}
@keyframes sneak{0%{opacity:0;filter:blur(18px);transform:translateY(26px) scale(1.07)}60%{opacity:.85;filter:blur(3px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:760px){.info{grid-template-columns:1fr;gap:10px}.top{padding-top:54px}.hero{padding-bottom:64px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,rgba(255,255,255,.10),transparent 68%)}
.g1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;animation:drift 38s ease-in-out infinite alternate}
.g2{width:50vmax;height:50vmax;right:-15vmax;bottom:-18vmax;animation:drift 46s ease-in-out infinite alternate-reverse}
.mandala{position:absolute;left:50%;top:46%;width:min(1100px,150vw);aspect-ratio:1;margin:calc(min(1100px,150vw)/-2) 0 0 calc(min(1100px,150vw)/-2);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.mandala svg{width:100%;height:100%;display:block}
.m1{opacity:.10;animation:spin 160s linear infinite}
.m2{opacity:.07;animation:spin 240s linear infinite reverse}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#050505 100%)}
main,footer{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#net{position:absolute;inset:0;width:100%;height:100%}
.back{display:inline-flex;margin-top:36px;padding:14px 26px;border:1px solid #333;border-radius:6px;color:#fff;background:var(--card);transition:background .25s,color .25s,border-color .25s}.back:hover{background:#fff;color:#000;border-color:#fff}.hero{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:0}
</style></head>

function set(l){document.documentElement.lang=l;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>set(b.dataset.l));
let l='tr';try{l=localStorage.getItem('lang')||''}catch(e){}
if(!T[l]){const n=(navigator.language||'tr').slice(0,2);l=T[n]?n:'tr'}
set(l);
(function(){
 const c=document.getElementById('net'),x=c.getContext('2d');
 let W,H,D,P=[],m={x:-999,y:-999},sy=0,last=0,E=0,dir=1;
 const pos=()=>window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;
 function init(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  const n=Math.round(Math.min(110,W*H/11000));
  P=Array.from({length:n},()=>{const z=Math.random()*.8+.2;return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,z,r:z*1.6+.4,px:0,py:0}})}
 function kick(a){E=Math.min(1,E+Math.min(1,Math.abs(a)/40));if(a)dir=a>0?1:-1}
 function onScroll(){const t=pos();kick(t-last);last=t}
 addEventListener('scroll',onScroll,{passive:true,capture:true});
 addEventListener('wheel',e=>kick(e.deltaY),{passive:true});
 addEventListener('touchmove',()=>kick(30),{passive:true});
 function draw(){
  const t=pos(),v=t-sy;sy+=v*.08;E*=.95;
  const e=E,sp=1+e*7;
  x.clearRect(0,0,W,H);
  const L=Math.min(160,Math.max(100,W/9))*(1+e*.6);
  for(const a of P){
   a.x+=a.vx*sp;a.y+=a.vy*sp+dir*e*a.z*2.2;
   if(a.x<0||a.x>W)a.vx*=-1;
   a.y=((a.y%H)+H)%H;
   a.px=a.x+Math.sin(sy*.004+a.z*7)*70*a.z;
   a.py=(((a.y-sy*a.z*1.1)%H)+H)%H;
   x.fillStyle='rgba(255,255,255,'+Math.min(1,.3+a.z*.4+e*.5)+')';
   x.beginPath();x.arc(a.px,a.py,a.r*(1+e*1.3),0,6.283);x.fill();
  }
  for(let i=0;i<P.length;i++){const a=P[i];
   for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.px-b.px,a.py-b.py);
    if(d<L){x.lineWidth=1+e*.8;x.strokeStyle='rgba(255,255,255,'+(.15*(1+e*2.5)*(1-d/L))+')';x.beginPath();x.moveTo(a.px,a.py);x.lineTo(b.px,b.py);x.stroke()}}
   const d=Math.hypot(a.px-m.x,a.py-m.y);
   if(d<L*1.6){x.lineWidth=1;x.strokeStyle='rgba(255,255,255,'+(.3*(1-d/(L*1.6)))+')';x.beginPath();x.moveTo(a.px,a.py);x.lineTo(m.x,m.y);x.stroke()}
  }
  requestAnimationFrame(draw)}
 addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
 addEventListener('pointerleave',()=>{m.x=m.y=-999});
 addEventListener('resize',init);
 last=pos();sy=last;init();draw();
})();
